3.2 Exigences d'Intégration
Communication entre modules via API REST
Synchronisation Firebase conditionnelle (mode online/offline)
Documentation API obligatoire via Swagger
4. Module Authentification
4.1 Description
Fournisseur d'identité centralisé gérant l'authentification des utilisateurs pour l'ensemble de l'écosystème.
4.2 Technologies
Backend : PHP MVC, Java, .Net ou Node.js (exclusion de FlightPHP)
Base de données : PostgreSQL
Conteneur : Docker
4.3 Fonctionnalités Exigées
Table
Copy
ID	Fonctionnalité	Priorité	Description
AUTH-001	Authentification email/password	Haute	Login sécurisé avec hashage des mots de passe
AUTH-002	Inscription utilisateur	Haute	Création de compte avec validation email
AUTH-003	Modification profil	Haute	Mise à jour des informations utilisateur
AUTH-004	Gestion des sessions	Haute	Durée de vie paramétrable des tokens/sessions
AUTH-005	Protection brute-force	Haute	Limite de 3 tentatives par défaut (configurable)
AUTH-006	Déblocage admin	Moyenne	API REST pour réinitialiser le blocage d'un utilisateur
AUTH-007	Documentation Swagger	Haute	Documentation complète de l'API
4.4 Spécifications de Sécurité
Rate Limiting : 3 tentatives de connexion échouées maximum
Blocage : Compte verrouillé après dépassement (déblocable via API admin)
Paramétrage : Nombre de tentatives configurable
Hashage : Algorithmes sécurisés (bcrypt/Argon2 recommandé)
5. Module Cartographie
5.1 Description
Infrastructure cartographique permettant l'affichage et la manipulation des données géospatiales.
5.2 Composants
Table
Copy
Composant	Technologie	Description
Serveur de tuiles	Docker container	Serveur cartographique offline
Données	OpenStreetMap	Extraction de la ville d'Antananarivo avec rues
Client web	Leaflet.js	Bibliothèque d'affichage interactif
Client mobile	Leaflet.js	Intégration mobile avec OSM online
5.3 Zone Couverte
Ville : Antananarivo, Madagascar
Données : Réseau routier complet, points d'intérêt, zones administratives
6. Module Web
6.1 Description
Application web permettant :
La consultation publique des travaux routiers (Visiteurs)
La gestion administrative des signalements (Managers)
6.2 Technologies
Framework : React, Angular ou VueJS (différent du mobile)
Cartographie : Leaflet.js
Authentification : API REST interne
6.3 Profils Utilisateurs
6.3.1 Visiteur (Accès Public)
Table
Copy
ID	Fonctionnalité	Description
WEB-VIS-001	Visualisation carte	Affichage de la carte avec points de problèmes routiers
WEB-VIS-002	Infobulles	Au survol : date, statut, surface (m²), budget, entreprise, lien photos
WEB-VIS-003	Tableau de bord	Récapitulatif : nombre de points, surface totale, avancement %, budget total
6.3.2 Manager (Authentification Requise)
Table
Copy
ID	Fonctionnalité	Description
WEB-MAN-001	Création comptes	Création de comptes utilisateurs (dont compte manager par défaut)
WEB-MAN-002	Synchronisation	• Récupération des signalements depuis Firebase
• Envoi des données vers mobile via Firebase
• Envoi des comptes mobiles créés
WEB-MAN-003	Déblocage	Interface de déblocage des utilisateurs bloqués
WEB-MAN-004	Gestion signalements	Saisie/modification : surface (m²), budget, entreprise concernée
WEB-MAN-005	Changement statuts	Modification du statut des signalements
WEB-MAN-006	Suivi avancement	Calcul automatique :
• Nouveau = 0%
• En cours = 50%
• Terminé = 100%
WEB-MAN-007	Historique dates	Enregistrement des dates pour chaque étape
WEB-MAN-008	Statistiques	Tableau des délais de traitement moyen
6.4 Règles de Gestion
Calcul de l'Avancement Global
Copy
Avancement_total = Σ(Avancement_individuel × Surface) / Surface_totale

Où :
- Nouveau = 0%
- En cours = 50%  
- Terminé = 100%
7. Module Mobile
7.1 Description
Application mobile de signalement terrain permettant aux citoyens de signaler les problèmes routiers.
7.2 Technologies
Framework : Ionic
Frontend : React, Angular ou VueJS (différent du web)
Cartographie : Leaflet + OpenStreetMap (online)
Notifications : Firebase Cloud Messaging
7.3 Fonctionnalités
Table
Copy
ID	Fonctionnalité	Description
MOB-001	Authentification	Login Firebase (compte créé uniquement par le manager web)
MOB-002	Signalement	Création de signalements via carte interactive
MOB-003	Géolocalisation	Positionnement automatique GPS
MOB-004	Médias	Ajout de 1 à plusieurs photos par signalement
MOB-005	Consultation	Affichage carte + récapitulatifs (même données que visiteur web)
MOB-006	Filtrage	Option "Afficher mes signalements uniquement"
MOB-007	Notifications	Alertes push à chaque changement de statut de ses signalements
