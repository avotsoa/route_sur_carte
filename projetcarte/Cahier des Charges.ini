1. Présentation du Projet
1.1 Contexte
Ce projet s'inscrit dans le cadre du semestre S5 pour la Promotion 17. Il vise à développer une solution cloud complète pour le suivi des travaux routiers dans la ville d'Antananarivo, Madagascar.
1.2 Portée du Projet
Le projet comprend trois modules interconnectés :
Un fournisseur d'identité (API d'authentification)
Une application web de gestion et consultation
Une application mobile de signalement terrain
