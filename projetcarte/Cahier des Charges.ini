2. Objectifs et Contraintes
2.1 Objectifs Principaux
[ ] Déployer un fournisseur d'identité sur Docker
[ ] Développer une API REST uniquement (sans interface pour l'authentification)
[ ] Créer une application web de suivi des travaux routiers
[ ] Développer une application mobile de signalement
[ ] Intégrer une solution de cartographie offline/online
2.2 Contraintes Techniques
Table
Copy
Catégorie	Contrainte
Conteneurisation	Docker obligatoire pour tous les services
Base de données	PostgreSQL uniquement (locale)
Firebase	Optionnel (si connexion Internet disponible)
Plateforme Auth	PHP MVC, Java, .Net ou Node.js (sauf FlightPHP)
Frameworks Web	React, Angular ou VueJS
Frameworks Mobile	Ionic + framework différent du web
